basePath: /api/v1
definitions:
  requests.CreateParentRequest:
    properties:
      address:
        type: string
      job:
        type: string
      locationID:
        type: integer
      name:
        type: string
      nik:
        type: string
      phoneNumber:
        type: string
    required:
    - address
    - job
    - locationID
    - name
    - nik
    - phoneNumber
    type: object
  requests.CreateToddlerRequest:
    properties:
      birthdate:
        type: string
      height:
        type: number
      locationID:
        type: integer
      name:
        type: string
      nutritionalStatus:
        type: string
      phoneNumber:
        type: string
      sex:
        enum:
        - male
        - female
        type: string
    required:
    - birthdate
    - height
    - locationID
    - name
    - nutritionalStatus
    - phoneNumber
    - sex
    type: object
  requests.CreateToddlerWithParentRequest:
    properties:
      parent:
        $ref: '#/definitions/requests.CreateParentRequest'
      toddler:
        $ref: '#/definitions/requests.CreateToddlerRequest'
    type: object
  requests.LoginRequest:
    properties:
      password:
        minLength: 6
        type: string
      phoneNumber:
        type: string
    required:
    - password
    - phoneNumber
    type: object
  requests.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  requests.ResetPasswordRequest:
    properties:
      confirmPassword:
        minLength: 6
        type: string
      firebaseToken:
        type: string
      password:
        minLength: 6
        type: string
      phoneNumber:
        type: string
    required:
    - confirmPassword
    - password
    - phoneNumber
    type: object
  requests.UpdateParentRequest:
    properties:
      address:
        type: string
      job:
        type: string
      locationID:
        type: integer
      name:
        type: string
      nik:
        type: string
      phoneNumber:
        type: string
    type: object
  requests.UpdatePredictRequest:
    properties:
      age:
        type: integer
      height:
        type: number
      nutritionalStatus:
        type: string
      sex:
        enum:
        - male
        - female
        type: string
      zscore:
        type: number
    type: object
  responses.BaseResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.PaginationMeta'
      success:
        type: boolean
    type: object
  responses.LoginResponse:
    properties:
      token:
        $ref: '#/definitions/responses.TokenResponse'
    type: object
  responses.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      totalData:
        type: integer
      totalPage:
        type: integer
    type: object
  responses.TokenResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@grovia.com
    name: API Support
  description: API documentation for Grovia App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Grovia API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with phone number and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/responses.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/responses.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: User login
      tags:
      - Authentication
  /auth/refresh-token:
    post:
